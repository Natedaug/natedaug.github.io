name: "Nate Blog"
description: "A jekyll blog by/for Nathan Kroenung"
avatar: http://nathankroenung.com/img/nate.jpg
url: "http://natedaug.github.io"
baseurl: ""

paginate: 20

plugins:
  - jekyll-paginate

markdown: kramdown
permalink: pretty


# Flags below are optional
#

# Includes an icon in the footer for each username you enter
footer-links:
  dribbble:
  email:
  facebook:
  flickr:
  github: natedaug
  instagram:
  linkedin:
  pinterest:
  rss:
  twitter: NathanKroenung
  stackoverflow:
  youtube:
  googleplus:


# Enter your Disqus shortname (not your username) to enable commenting on posts
# You can find your shortname on the Settings page of your Disqus account
disqus: ""

# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics: ""

exclude: [node_modules, gulpfile.js, package.json]
